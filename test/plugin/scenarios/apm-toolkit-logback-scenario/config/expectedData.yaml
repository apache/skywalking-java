segmentItems:
- serviceName: apm-toolkit-logback-scenario
  segmentSize: ge 1
  segments:
  - segmentId: not null
    spans:
    - operationName: logback-case
      parentSpanId: -1
      spanId: 0
      spanLayer: Unknown
      startTime: nq 0
      endTime: nq 0
      componentId: 0
      isError: false
      spanType: Entry
      peer: ''
      skipAnalysis: false
      refs:
      - {parentEndpoint: /upstream, networkAddress: 'upstream:8080', refType: CrossProcess,
         parentSpanId: 1, parentTraceSegmentId: upstream-segment-id, parentServiceInstance: upstream-instance,
         parentService: upstream-service, traceId: logback-scenario-trace-id}
logItems:
- serviceName: apm-toolkit-logback-scenario
  logSize: 3
  logs:
  # Rendered on the AsyncAppender worker thread from the context captured when the event was created.
  # The gRPC reporter does not attach a trace context there, so only the text is checked.
  - timestamp: nq 0
    body:
      type: TEXT
      content:
        text: 'start with async-mdc-layout user=skywalking TID:logback-scenario-trace-id SW_CTX:[apm-toolkit-logback-scenario,logback-scenario-instance,logback-scenario-trace-id,'
  - timestamp: nq 0
    endpoint: logback-case
    traceContext:
      traceId: logback-scenario-trace-id
      traceSegmentId: not blank
      spanId: 0
    body:
      type: TEXT
      content:
        text: 'start with mdc-layout user=skywalking TID:logback-scenario-trace-id SW_CTX:[apm-toolkit-logback-scenario,logback-scenario-instance,logback-scenario-trace-id,'
    tags:
      data:
        - key: level
          value: INFO
        - key: logger
          value: test.apache.skywalking.apm.testcase.logback.CaseHandler
        - key: thread
          value: not blank
  - timestamp: nq 0
    endpoint: logback-case
    traceContext:
      traceId: logback-scenario-trace-id
      traceSegmentId: not blank
      spanId: 0
    body:
      type: TEXT
      content:
        text: 'start with tid-layout TID:logback-scenario-trace-id SW_CTX:[apm-toolkit-logback-scenario,logback-scenario-instance,logback-scenario-trace-id,'
    tags:
      data:
        - key: level
          value: INFO
        - key: logger
          value: test.apache.skywalking.apm.testcase.logback.CaseHandler
        - key: thread
          value: not blank
